name = "reading-my-tarot"
main = "worker/src/index.js"
compatibility_date = "2026-06-18"

[vars]
OPENAI_MODEL = "gpt-5.4-mini"
OPENAI_REASONING_EFFORT = "low"
OPENAI_MAX_OUTPUT_TOKENS = "1600"
ALLOWED_ORIGIN = "http://127.0.0.1:8787,http://localhost:8787,http://127.0.0.1:54173,http://localhost:54173,https://reading-my-tarot.elly1000chun.workers.dev,https://elly1000chun.github.io"

[secrets]
required = ["OPENAI_API_KEY"]

[assets]
directory = "public"
run_worker_first = ["/api/*"]

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

[placement]
region = "aws:us-east-1"
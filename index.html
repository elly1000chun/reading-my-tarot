<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarot Reading - Discover Your Path</title>
  <meta name="description" content="Get a personalized Tarot reading and discover your path. Explore insights and guidance with Tarot.js. Experience the magic today!">
  <meta name="keywords" content="tarot reading, tarot cards, tarot insights, tarot.js, spiritual guidance, tarot predictions, mystic reading">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Tarot Reading - Discover Your Path">
  <meta property="og:description" content="Get a personalized Tarot reading and discover your path. Explore insights and guidance with Tarot.js. Experience the magic today!">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    .fade-out {
      opacity: 1;
      /* Start fully visible */
      animation: fadeOut 0.5s forwards;
      /* Apply the fade-out animation */
    }

    @keyframes fadeOut {
      0% {
        opacity: 1;
        /* Fully visible */
      }

      100% {
        opacity: 0;
        /* Fully transparent */
      }
    }

    .fade-in {
      animation: fadeIn 0.5s forwards;
      /* Apply the fade-in animation */
    }

    @keyframes fadeIn {
      0% {
        opacity: 0;
        /* Fully transparent */
      }

      100% {
        opacity: 1;
        /* Fully visible */
      }
    }
  </style>
</head>

<body class="bg-gray-900 text-white min-h-screen">
  
  <!-- Page Loader Overlay -->
<div id="pageLoader" class="fixed inset-0 z-50 flex items-center justify-center bg-gray-900 text-purple-400">
  <div class="text-center">
    <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-purple-500 mx-auto"></div>
    <p class="mt-6 text-lg">Shuffling the cards...</p>
  </div>
</div>

  
  <div class="container mx-auto px-4 py-8">
    <!-- Header -->
    <header class="text-center mb-12">
      <h1 class="text-4xl font-bold mb-4 text-purple-400">
        <i class="fas fa-moon mr-2"></i>Mystic Tarot
      </h1>
      <div class="flex flex-wrap items-center justify-center gap-3">
        <div class="inline-flex rounded-lg border border-purple-500 overflow-hidden" id="languageSelector">
          <button class="language-btn px-4 py-2 text-sm transition-colors" data-language="en">English</button>
          <button class="language-btn px-4 py-2 text-sm transition-colors" data-language="ko">한국어</button>
        </div>
        <div id="newReadingBtn" class="hidden fade-in">
          <button class="bg-purple-600 hover:bg-purple-700 px-4 py-2 rounded-lg text-sm transition-all duration-300">
            New Reading
          </button>
        </div>
      </div>
    </header>

    <!-- Question Input -->
    <section class="max-w-2xl mx-auto bg-gray-800 rounded-lg p-6 mb-6 fade-in" id="questionSection">
      <label id="questionLabel" class="mb-3 block text-lg font-semibold text-purple-300" for="questionInput">
        What would you like the cards to reflect on?
      </label>
      <textarea
        id="questionInput"
        class="min-h-28 w-full resize-y rounded-lg border border-gray-700 bg-gray-900 px-4 py-3 text-white placeholder:text-gray-500 focus:border-purple-500 focus:outline-none focus:ring-2 focus:ring-purple-500/40"
        maxlength="500"
        placeholder="Ask about a situation, choice, relationship, or the energy around today."
        aria-describedby="questionHelpText questionError"
      ></textarea>
      <p id="questionHelpText" class="mt-3 text-sm text-gray-400">
        Optional. If you leave this blank, the reading will focus on the message you need right now.
      </p>
      <p id="questionError" class="mt-2 hidden text-sm text-red-300"></p>
    </section>

    <!-- Spread Selection -->
    <div class="max-w-2xl mx-auto bg-gray-800 rounded-lg p-6 mb-8 fade-in" id="spreadSelection">
      <h2 class="text-xl mb-4 text-center">Choose Your Spread</h2>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4" id="spreadButtons">
        <button class="spread-btn bg-purple-600 hover:bg-purple-700 p-4 rounded-lg transition-all duration-300 transform hover:scale-105">
          <i class="fas fa-star mb-2"></i>
          <span class="block">Single Card</span>
        </button>
        <button class="spread-btn bg-purple-600 hover:bg-purple-700 p-4 rounded-lg transition-all duration-300 transform hover:scale-105">
          <i class="fas fa-cards mb-2"></i>
          <span class="block">Three Cards</span>
        </button>
        <button class="spread-btn bg-purple-600 hover:bg-purple-700 p-4 rounded-lg transition-all duration-300 transform hover:scale-105">
          <i class="fas fa-cross mb-2"></i>
          <span class="block">Celtic Cross</span>
        </button>
      </div>
    </div>

    <!-- Loading Animation -->
    <div id="loadingAnimation" class="hidden text-center py-8 fade-in">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-t-2 border-b-2 border-purple-500"></div>
      <p id="loadingText" class="mt-4 text-purple-400">Consulting the cards...</p>
    </div>

    <!-- Reading Results -->
    <div id="readingResults" class="hidden max-w-4xl mx-auto fade-in">
      <section id="interpretationPanel" class="hidden mb-8 rounded-lg bg-gray-800 p-6 text-left shadow-lg">
        <h2 id="interpretationTitle" class="mb-3 text-xl font-semibold text-purple-300">
          Reading summary
        </h2>
        <p id="interpretationSummary" class="leading-7 text-gray-200"></p>
        <p id="interpretationStatus" class="mt-4 text-sm text-purple-200" aria-live="polite"></p>
      </section>
      <div id="spreadContainer" class="grid gap-6">
        <!-- Cards will be inserted here -->
      </div>
    </div>

  </div>

  <!-- Card Details Modal -->
  <div id="detailsModal" class="hidden fixed inset-0 z-50 bg-black/70 p-4">
    <div class="mx-auto flex h-full max-w-3xl flex-col rounded-lg bg-gray-800 shadow-2xl">
      <div class="flex items-center justify-between border-b border-gray-700 px-6 py-4">
        <h2 id="detailsModalTitle" class="text-xl font-semibold text-purple-400">Card Details</h2>
        <button
          id="detailsModalClose"
          class="rounded-lg bg-purple-600 px-4 py-2 text-sm text-white transition-colors hover:bg-purple-700"
          type="button"
        >
          Close
        </button>
      </div>
      <iframe
        id="detailsModalFrame"
        class="min-h-0 flex-1 rounded-b-lg bg-gray-900"
        title="Card details"
      ></iframe>
    </div>
  </div>


  
<script type="module">
import Tarot from "./src/tarot.js";

const deckPaths = {
  en: "./decks/en/default.json",
  ko: "./decks/ko/default.json"
};

const aiInterpretationEndpoint = "/api/interpret-reading";

const copyByLanguage = {
  en: {
    questionLabel: "What would you like the cards to reflect on?",
    questionPlaceholder:
      "Ask about a situation, choice, relationship, or the energy around today.",
    questionHelpText:
      "Optional. If you leave this blank, the reading will focus on the message you need right now.",
    questionError: "Please keep your question under 500 characters.",
    defaultQuestion: "What message do I need right now?",
    loadingText: "Consulting the cards...",
    interpretationTitle: "Reading summary",
    interpretationLocalStatus:
      "Local summary shown while AI checks for an expanded interpretation.",
    interpretationAiLoading: "Checking for AI interpretation...",
    interpretationAiReady: "AI interpretation applied.",
    interpretationFallbackStatus:
      "Local summary shown. AI interpretation is unavailable right now.",
    fallbackTheme: "the message available in the cards"
  },
  ko: {
    questionLabel: "카드에게 어떤 질문을 건네고 싶나요?",
    questionPlaceholder:
      "상황, 선택, 관계, 오늘의 흐름 등 궁금한 내용을 적어보세요.",
    questionHelpText:
      "선택 사항입니다. 비워두면 지금 나에게 필요한 메시지를 기준으로 리딩합니다.",
    questionError: "질문은 500자 이내로 입력해주세요.",
    defaultQuestion: "지금 나에게 필요한 메시지는 무엇인가요?",
    loadingText: "카드의 메시지를 살펴보는 중...",
    interpretationTitle: "리딩 요약",
    interpretationLocalStatus:
      "AI 해석을 확인하는 동안 로컬 요약을 먼저 표시합니다.",
    interpretationAiLoading: "AI 해석을 확인하는 중...",
    interpretationAiReady: "AI 해석이 적용되었습니다.",
    interpretationFallbackStatus:
      "AI 해석을 사용할 수 없어 로컬 요약을 유지합니다.",
    fallbackTheme: "카드가 보여주는 메시지"
  }
};

let currentLanguage = "ko";
let tarot = null;
let viewToken = 0;
let languageLoadToken = 0;
let currentReading = [];
let currentSpreadType = null;
let currentQuestion = "";

const deckCache = new Map();
const cardLookupByLanguage = new Map();

// Load an existing tarot deck via fetch.
async function fetchDeck(language) {
  const response = await fetch(deckPaths[language]);
  if (!response.ok) {
    throw new Error(`HTTP error! Status: ${response.status}`);
  }
  return response.json();
}

async function getDeck(language) {
  if (deckCache.has(language)) {
    return deckCache.get(language);
  }

  const deck = await fetchDeck(language);
  deckCache.set(language, deck);
  cardLookupByLanguage.set(
    language,
    new Map(deck.map((card) => [card.name, card]))
  );
  return deck;
}

// DOM Elements
const loadingAnimation = document.getElementById("loadingAnimation");
const readingResults = document.getElementById("readingResults");
const interpretationPanel = document.getElementById("interpretationPanel");
const interpretationTitle = document.getElementById("interpretationTitle");
const interpretationSummary = document.getElementById("interpretationSummary");
const interpretationStatus = document.getElementById("interpretationStatus");
const spreadContainer = document.getElementById("spreadContainer");
const spreadSelection = document.getElementById("spreadSelection");
const newReadingBtn = document.getElementById("newReadingBtn");
const spreadButtons = document.querySelectorAll(".spread-btn");
const languageButtons = document.querySelectorAll(".language-btn");
const questionInput = document.getElementById("questionInput");
const questionLabel = document.getElementById("questionLabel");
const questionHelpText = document.getElementById("questionHelpText");
const questionError = document.getElementById("questionError");
const loadingText = document.getElementById("loadingText");
const detailsModal = document.getElementById("detailsModal");
const detailsModalTitle = document.getElementById("detailsModalTitle");
const detailsModalFrame = document.getElementById("detailsModalFrame");
const detailsModalClose = document.getElementById("detailsModalClose");

function registerSpreads(tarotInstance) {
  tarotInstance.addSpread("single", {
    positions: ["Your card"],
    description: "A simple one-card reading for quick insights",
    cardCount: 1
  });

  tarotInstance.addSpread("Three-Card Spread", {
    positions: ["Past", "Present", "Future"],
    description: "Insight into past, present, and future aspects."
  });

  tarotInstance.addSpread("celtic-cross", {
    positions: [
      "Yourself",
      "Your obstacle",
      "Root of the question",
      "The past",
      "Hopes/fears",
      "The future",
      "Root of the outcome",
      "Others in the outcome",
      "Hopes/fears for outcome",
      "Outcome"
    ],
    description: "Traditional Celtic Cross spread for in-depth readings",
    cardCount: 10
  });
}

function initializeTarot(deck) {
  tarot = new Tarot();
  tarot.initializeDeck(deck);
  registerSpreads(tarot);
}

function resetReadingView() {
  viewToken += 1;
  currentReading = [];
  currentSpreadType = null;
  currentQuestion = "";
  loadingAnimation.classList.add("hidden");
  readingResults.classList.add("hidden");
  newReadingBtn.classList.add("hidden");
  resetInterpretation();
  spreadContainer.innerHTML = "";
  spreadSelection.classList.remove("hidden", "fade-out");
  spreadSelection.classList.add("fade-in");
}

function updateLanguageButtons() {
  languageButtons.forEach((button) => {
    const isActive = button.dataset.language === currentLanguage;
    button.classList.toggle("bg-purple-600", isActive);
    button.classList.toggle("text-white", isActive);
    button.classList.toggle("bg-gray-800", !isActive);
    button.classList.toggle("text-purple-200", !isActive);
    button.disabled = isActive;
  });
}

function updateLanguageCopy() {
  const copy = copyByLanguage[currentLanguage] || copyByLanguage.en;
  questionLabel.textContent = copy.questionLabel;
  questionInput.placeholder = copy.questionPlaceholder;
  questionInput.setAttribute("aria-label", copy.questionLabel);
  questionHelpText.textContent = copy.questionHelpText;
  questionError.textContent = copy.questionError;
  loadingText.textContent = copy.loadingText;
  interpretationTitle.textContent = copy.interpretationTitle;
}

function getCurrentQuestion() {
  const copy = copyByLanguage[currentLanguage] || copyByLanguage.en;
  return questionInput.value.trim() || copy.defaultQuestion;
}

function getCardMeaning(card) {
  if (Array.isArray(card.meanings) && card.meanings.length > 0) {
    return card.meanings[0];
  }

  return card.description || card.name;
}

function getReadingThemes(reading, language) {
  const copy = copyByLanguage[language] || copyByLanguage.en;
  const themes = reading
    .map(({ card }) => getCardMeaning(card))
    .filter(Boolean)
    .slice(0, 3);

  return themes.length > 0 ? themes.join(", ") : copy.fallbackTheme;
}

function createLocalInterpretation({ question, spreadType, reading, language }) {
  const copy = copyByLanguage[language] || copyByLanguage.en;
  const safeQuestion = question || copy.defaultQuestion;
  const firstCard = reading[0];
  const finalCard = reading.length > 1 ? reading[reading.length - 1] : null;
  const themes = getReadingThemes(reading, language);

  if (!firstCard) {
    return language === "ko"
      ? `"${safeQuestion}"에 대한 리딩은 아직 준비되지 않았습니다.`
      : `The reading for "${safeQuestion}" is not ready yet.`;
  }

  const firstMeaning = getCardMeaning(firstCard.card);

  if (language === "ko") {
    const opening = `"${safeQuestion}"에 대한 ${spreadType} 리딩은 ${themes}의 흐름을 보여줍니다.`;
    const focus = `${firstCard.position} 위치의 ${firstCard.card.name} 카드는 ${firstMeaning}을 중심 메시지로 강조합니다.`;
    const closing = finalCard
      ? `마지막으로 ${finalCard.position} 위치의 ${finalCard.card.name} 카드는 이 질문을 바라볼 때 ${getCardMeaning(finalCard.card)}을 함께 살펴보라고 말합니다.`
      : "이 카드는 지금 가장 먼저 바라봐야 할 마음의 방향을 차분히 짚어줍니다.";

    return `${opening} ${focus} ${closing} 이 요약은 확정된 예언보다 지금의 선택과 감정을 정리하기 위한 참고 메시지로 받아들이면 좋습니다.`;
  }

  const opening = `For "${safeQuestion}", this ${spreadType} reading points toward ${themes}.`;
  const focus = `The ${firstCard.position} position brings ${firstCard.card.name}, highlighting ${firstMeaning}.`;
  const closing = finalCard
    ? `The reading closes with ${finalCard.card.name} in ${finalCard.position}, inviting you to consider ${getCardMeaning(finalCard.card)} as you respond to the question.`
    : "This card offers a focused prompt for the first direction to consider.";

  return `${opening} ${focus} ${closing} Treat this as a reflective guide rather than a fixed prediction.`;
}

function createAiInterpretationPayload({ question, spreadType, reading, language }) {
  return {
    question,
    language,
    spreadType,
    cards: reading.map(({ position, card }) => ({
      position,
      name: card.name,
      meanings: Array.isArray(card.meanings) ? card.meanings : [],
      description: card.description || ""
    }))
  };
}

async function requestAiInterpretation(payload) {
  const response = await fetch(aiInterpretationEndpoint, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify(payload)
  });

  if (!response.ok) {
    throw new Error(`AI interpretation request failed: ${response.status}`);
  }

  const result = await response.json();
  if (!result || typeof result.summary !== "string" || !result.summary.trim()) {
    throw new Error("AI interpretation response did not include a summary");
  }

  return {
    summary: result.summary.trim(),
    source: result.source || "ai"
  };
}

async function updateInterpretationFromAi(token, payload) {
  const copy = copyByLanguage[currentLanguage] || copyByLanguage.en;
  setInterpretationStatus(copy.interpretationAiLoading);

  try {
    const result = await requestAiInterpretation(payload);
    if (token !== viewToken) {
      return;
    }
    renderInterpretation(result.summary, copy.interpretationAiReady);
  } catch (error) {
    console.info("Using local tarot interpretation fallback.", error);
    if (token !== viewToken) {
      return;
    }
    setInterpretationStatus(copy.interpretationFallbackStatus);
  }
}

function renderInterpretation(summary, statusText = "") {
  const copy = copyByLanguage[currentLanguage] || copyByLanguage.en;
  interpretationTitle.textContent = copy.interpretationTitle;
  interpretationSummary.textContent = summary;
  setInterpretationStatus(statusText);
  interpretationPanel.classList.remove("hidden");
}

function setInterpretationStatus(statusText) {
  interpretationStatus.textContent = statusText;
  interpretationStatus.classList.toggle("hidden", !statusText);
}

function resetInterpretation() {
  interpretationSummary.textContent = "";
  setInterpretationStatus("");
  interpretationPanel.classList.add("hidden");
}

function renderLocalInterpretation() {
  const copy = copyByLanguage[currentLanguage] || copyByLanguage.en;
  renderInterpretation(
    createLocalInterpretation({
      question: currentQuestion,
      spreadType: currentSpreadType,
      reading: currentReading,
      language: currentLanguage
    }),
    copy.interpretationLocalStatus
  );
}

function requestAiInterpretationForCurrentReading(token) {
  const interpretationPayload = createAiInterpretationPayload({
    question: currentQuestion,
    spreadType: currentSpreadType,
    reading: currentReading,
    language: currentLanguage
  });

  updateInterpretationFromAi(token, interpretationPayload);
}

async function setLanguage(language) {
  if (language === currentLanguage && tarot) {
    return;
  }

  const token = ++languageLoadToken;
  viewToken += 1;
  currentLanguage = language;
  updateLanguageButtons();
  updateLanguageCopy();
  const deck = await getDeck(language);
  if (token !== languageLoadToken) {
    return;
  }
  initializeTarot(deck);

  if (currentReading.length > 0) {
    currentReading = localizeReading(currentReading, language);
    currentQuestion = getCurrentQuestion();
    setupSpreadGrid(currentSpreadType);
    renderLocalInterpretation();
    renderReading(currentReading);
    requestAiInterpretationForCurrentReading(viewToken);
    loadingAnimation.classList.add("hidden");
    newReadingBtn.classList.remove("hidden");
    return;
  }

  loadingAnimation.classList.add("hidden");
}

// Helper function to create card element
function createCardElement(card, position) {
  const cardDiv = document.createElement("div");
  const isReversed = card.name.includes("Reversed");
  const detailsHtml = card["details-html"];
  const cardVisual = card.image
    ? `<img src="./decks/images/${card.image}" alt="${card.name}" class="mx-auto mb-4 h-56 w-auto rounded-md shadow-lg transition-transform duration-500 ${
        isReversed ? "rotate-180" : ""
      }">`
    : `<div class="text-4xl mb-4">${card.symbol}</div>`;
  const detailsButton = detailsHtml
    ? `<button class="show-details-btn mt-4 w-full rounded-lg bg-purple-600 px-4 py-2 text-sm font-semibold text-white transition-colors hover:bg-purple-700" type="button" data-card-name="${card.name}" data-details-html="${detailsHtml}">Show Details</button>`
    : "";

  cardDiv.className =
    "bg-gray-800 p-6 rounded-lg transform transition-all duration-500 hover:scale-105 fade-in";
  cardDiv.innerHTML = `
                <h3 class="text-lg font-semibold text-purple-400 mb-2">${position}</h3>
                <div class="card-content bg-gray-700 p-4 rounded-lg">
                    ${cardVisual}
                    <h4 class="text-xl mb-2">${card.name}</h4>
                    <p class="text-gray-400 mb-2">${card.description}</p>
                    <p class="text-purple-300 italic">${
                      card.meanings.length > 1
                        ? card.meanings.join(", ")
                        : card.meanings[0]
                    }</p>
                    ${detailsButton}
                </div>
            `;
  return cardDiv;
}

function openDetailsModal(cardName, detailsHtml) {
  detailsModalTitle.textContent = `${cardName} Details`;
  detailsModalFrame.src = `./decks/ko/details-html/${encodeURIComponent(detailsHtml)}`;
  detailsModal.classList.remove("hidden");
}

function closeDetailsModal() {
  detailsModal.classList.add("hidden");
  detailsModalFrame.removeAttribute("src");
}

function localizeReading(reading, language) {
  const cardLookup = cardLookupByLanguage.get(language);

  return reading.map(({ position, card }) => ({
    position,
    card: cardLookup?.get(card.name) || card
  }));
}

function setupSpreadGrid(spreadType) {
  if (spreadType === "single") {
    spreadContainer.className = "grid gap-6";
  } else if (spreadType === "Three-Card Spread") {
    spreadContainer.className = "grid grid-cols-1 md:grid-cols-3 gap-6";
  } else if (spreadType === "celtic-cross") {
    spreadContainer.className =
      "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6";
  }
}

function renderReading(reading) {
  spreadContainer.innerHTML = "";
  reading.forEach(({ position, card }) => {
    spreadContainer.appendChild(createCardElement(card, position));
  });
  readingResults.classList.remove("hidden");
}

// Function to perform reading
async function performReading(spreadType) {
  const token = viewToken;
  currentSpreadType = spreadType;
  currentQuestion = getCurrentQuestion();
  currentReading = [];

  // Show loading animation
  loadingAnimation.classList.remove("hidden");
  readingResults.classList.add("hidden");
  resetInterpretation();

  // Clear previous reading
  spreadContainer.innerHTML = "";

  // Simulate loading time
  await new Promise((resolve) => setTimeout(resolve, 1500));
  if (token !== viewToken) {
    return;
  }

  // Get reading
  const reading = tarot.doReading(spreadType);
  currentReading = reading;

  // Setup grid based on spread type
  setupSpreadGrid(spreadType);
  renderLocalInterpretation();
  requestAiInterpretationForCurrentReading(token);

  // Hide loading and show results
  loadingAnimation.classList.add("hidden");
  readingResults.classList.remove("hidden");

  // Reveal cards one by one
  for (let i = 0; i < reading.length; i++) {
    await new Promise((resolve) => setTimeout(resolve, 500));
    if (token !== viewToken) {
      return;
    }
    const cardElement = createCardElement(
      currentReading[i].card,
      currentReading[i].position
    );
    spreadContainer.appendChild(cardElement);
  }

  setTimeout(() => {
    if (token !== viewToken) {
      return;
    }
    newReadingBtn.classList.remove("hidden");
  }, 500); // Delay of 500 milliseconds (smooth things out)
}

// Event Listeners

spreadButtons.forEach((button, index) => {
  button.addEventListener("click", () => {
    const token = viewToken;
    spreadSelection.classList.add("fade-out");
    spreadSelection.classList.remove("fade-in");
    setTimeout(() => {
      if (token !== viewToken) {
        return;
      }
      spreadSelection.classList.add("hidden", "fade-in");
      spreadSelection.classList.remove("fade-out");
      //newReadingBtn.classList.remove('hidden');

      const spreadTypes = tarot.listSpreads();
      performReading(spreadTypes[index]);
    }, 500); // Delay of 500 milliseconds (smooth things out)
  });
});

newReadingBtn.addEventListener("click", () => {
  currentReading = [];
  currentSpreadType = null;
  currentQuestion = "";
  readingResults.classList.add("hidden");
  newReadingBtn.classList.add("hidden");
  resetInterpretation();
  spreadSelection.classList.remove("hidden");
});

languageButtons.forEach((button) => {
  button.addEventListener("click", () => {
    setLanguage(button.dataset.language).catch((error) => {
      console.error("Failed to switch language:", error);
    });
  });
});

spreadContainer.addEventListener("click", (event) => {
  const button = event.target.closest(".show-details-btn");
  if (!button) {
    return;
  }

  openDetailsModal(button.dataset.cardName, button.dataset.detailsHtml);
});

detailsModalClose.addEventListener("click", closeDetailsModal);

detailsModal.addEventListener("click", (event) => {
  if (event.target === detailsModal) {
    closeDetailsModal();
  }
});

  
(async () => {
  try {
    updateLanguageButtons();
    updateLanguageCopy();
    await setLanguage(currentLanguage);

    // Handle page loader fade-out
    const loader = document.getElementById("pageLoader");
    loader.classList.add("opacity-0", "transition-opacity", "duration-700");

    // Wait for the transition to finish before hiding the loader
    setTimeout(() => {
      loader.style.display = "none";
    }, 700);
    
  } catch (error) {
    console.error("❌ Failed to fetch deck:", error);
  }
})();

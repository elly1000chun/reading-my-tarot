<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarot Reading - Discover Your Path</title>
  <meta name="description" content="Get a personalized Tarot reading and discover your path. Explore insights and guidance with Tarot.js. Experience the magic today!">
  <meta name="keywords" content="tarot reading, tarot cards, tarot insights, tarot.js, spiritual guidance, tarot predictions, mystic reading">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Tarot Reading - Discover Your Path">
  <meta property="og:description" content="Get a personalized Tarot reading and discover your path. Explore insights and guidance with Tarot.js. Experience the magic today!">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    .fade-out {
      opacity: 1;
      /* Start fully visible */
      animation: fadeOut 0.5s forwards;
      /* Apply the fade-out animation */
    }

    @keyframes fadeOut {
      0% {
        opacity: 1;
        /* Fully visible */
      }

      100% {
        opacity: 0;
        /* Fully transparent */
      }
    }

    .fade-in {
      animation: fadeIn 0.5s forwards;
      /* Apply the fade-in animation */
    }

    @keyframes fadeIn {
      0% {
        opacity: 0;
        /* Fully transparent */
      }

      100% {
        opacity: 1;
        /* Fully visible */
      }
    }
  </style>
</head>

<body class="bg-gray-900 text-white min-h-screen">
  
  <!-- Page Loader Overlay -->
<div id="pageLoader" class="fixed inset-0 z-50 flex items-center justify-center bg-gray-900 text-purple-400">
  <div class="text-center">
    <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-purple-500 mx-auto"></div>
    <p class="mt-6 text-lg">Shuffling the cards...</p>
  </div>
</div>

  
  <div class="container mx-auto px-4 py-8">
    <!-- Header -->
    <header class="text-center mb-12">
      <h1 class="text-4xl font-bold mb-4 text-purple-400">
        <i class="fas fa-moon mr-2"></i>Mystic Tarot
      </h1>
      <div class="inline-flex rounded-lg border border-purple-500 overflow-hidden" id="languageSelector">
        <button class="language-btn px-4 py-2 text-sm transition-colors" data-language="en">English</button>
        <button class="language-btn px-4 py-2 text-sm transition-colors" data-language="ko">한국어</button>
      </div>
    </header>

    <!-- Spread Selection -->
    <div class="max-w-2xl mx-auto bg-gray-800 rounded-lg p-6 mb-8 fade-in" id="spreadSelection">
      <h2 class="text-xl mb-4 text-center">Choose Your Spread</h2>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4" id="spreadButtons">
        <button class="spread-btn bg-purple-600 hover:bg-purple-700 p-4 rounded-lg transition-all duration-300 transform hover:scale-105">
          <i class="fas fa-star mb-2"></i>
          <span class="block">Single Card</span>
        </button>
        <button class="spread-btn bg-purple-600 hover:bg-purple-700 p-4 rounded-lg transition-all duration-300 transform hover:scale-105">
          <i class="fas fa-cards mb-2"></i>
          <span class="block">Three Cards</span>
        </button>
        <button class="spread-btn bg-purple-600 hover:bg-purple-700 p-4 rounded-lg transition-all duration-300 transform hover:scale-105">
          <i class="fas fa-cross mb-2"></i>
          <span class="block">Celtic Cross</span>
        </button>
      </div>
    </div>

    <!-- Loading Animation -->
    <div id="loadingAnimation" class="hidden text-center py-8 fade-in">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-t-2 border-b-2 border-purple-500"></div>
      <p class="mt-4 text-purple-400">Consulting the cards...</p>
    </div>

    <!-- Reading Results -->
    <div id="readingResults" class="hidden max-w-4xl mx-auto fade-in">
      <div id="spreadContainer" class="grid gap-6">
        <!-- Cards will be inserted here -->
      </div>
    </div>

    <!-- New Reading Button -->
    <div id="newReadingBtn" class="hidden text-center mt-8 fade-in">
      <button class="bg-purple-600 hover:bg-purple-700 px-6 py-3 rounded-lg transition-all duration-300">
        New Reading
      </button>
    </div>
  </div>

  <!-- Card Details Modal -->
  <div id="detailsModal" class="hidden fixed inset-0 z-50 bg-black/70 p-4">
    <div class="mx-auto flex h-full max-w-3xl flex-col rounded-lg bg-gray-800 shadow-2xl">
      <div class="flex items-center justify-between border-b border-gray-700 px-6 py-4">
        <h2 id="detailsModalTitle" class="text-xl font-semibold text-purple-400">Card Details</h2>
        <button
          id="detailsModalClose"
          class="rounded-lg bg-purple-600 px-4 py-2 text-sm text-white transition-colors hover:bg-purple-700"
          type="button"
        >
          Close
        </button>
      </div>
      <iframe
        id="detailsModalFrame"
        class="min-h-0 flex-1 rounded-b-lg bg-gray-900"
        title="Card details"
      ></iframe>
    </div>
  </div>


  
<script type="module">
import Tarot from "./src/tarot.js";

const deckPaths = {
  en: "./decks/en/default.json",
  ko: "./decks/ko/default.json"
};

let currentLanguage = "ko";
let tarot = null;
let viewToken = 0;
let languageLoadToken = 0;
let currentReading = [];
let currentSpreadType = null;

const deckCache = new Map();
const cardLookupByLanguage = new Map();

// Load an existing tarot deck via fetch.
async function fetchDeck(language) {
  const response = await fetch(deckPaths[language]);
  if (!response.ok) {
    throw new Error(`HTTP error! Status: ${response.status}`);
  }
  return response.json();
}

async function getDeck(language) {
  if (deckCache.has(language)) {
    return deckCache.get(language);
  }

  const deck = await fetchDeck(language);
  deckCache.set(language, deck);
  cardLookupByLanguage.set(
    language,
    new Map(deck.map((card) => [card.name, card]))
  );
  return deck;
}

// DOM Elements
const loadingAnimation = document.getElementById("loadingAnimation");
const readingResults = document.getElementById("readingResults");
const spreadContainer = document.getElementById("spreadContainer");
const spreadSelection = document.getElementById("spreadSelection");
const newReadingBtn = document.getElementById("newReadingBtn");
const spreadButtons = document.querySelectorAll(".spread-btn");
const languageButtons = document.querySelectorAll(".language-btn");
const detailsModal = document.getElementById("detailsModal");
const detailsModalTitle = document.getElementById("detailsModalTitle");
const detailsModalFrame = document.getElementById("detailsModalFrame");
const detailsModalClose = document.getElementById("detailsModalClose");

function registerSpreads(tarotInstance) {
  tarotInstance.addSpread("single", {
    positions: ["Your card"],
    description: "A simple one-card reading for quick insights",
    cardCount: 1
  });

  tarotInstance.addSpread("Three-Card Spread", {
    positions: ["Past", "Present", "Future"],
    description: "Insight into past, present, and future aspects."
  });

  tarotInstance.addSpread("celtic-cross", {
    positions: [
      "Yourself",
      "Your obstacle",
      "Root of the question",
      "The past",
      "Hopes/fears",
      "The future",
      "Root of the outcome",
      "Others in the outcome",
      "Hopes/fears for outcome",
      "Outcome"
    ],
    description: "Traditional Celtic Cross spread for in-depth readings",
    cardCount: 10
  });
}

function initializeTarot(deck) {
  tarot = new Tarot();
  tarot.initializeDeck(deck);
  registerSpreads(tarot);
}

function resetReadingView() {
  viewToken += 1;
  currentReading = [];
  currentSpreadType = null;
  loadingAnimation.classList.add("hidden");
  readingResults.classList.add("hidden");
  newReadingBtn.classList.add("hidden");
  spreadContainer.innerHTML = "";
  spreadSelection.classList.remove("hidden", "fade-out");
  spreadSelection.classList.add("fade-in");
}

function updateLanguageButtons() {
  languageButtons.forEach((button) => {
    const isActive = button.dataset.language === currentLanguage;
    button.classList.toggle("bg-purple-600", isActive);
    button.classList.toggle("text-white", isActive);
    button.classList.toggle("bg-gray-800", !isActive);
    button.classList.toggle("text-purple-200", !isActive);
    button.disabled = isActive;
  });
}

async function setLanguage(language) {
  if (language === currentLanguage && tarot) {
    return;
  }

  const token = ++languageLoadToken;
  viewToken += 1;
  currentLanguage = language;
  updateLanguageButtons();
  const deck = await getDeck(language);
  if (token !== languageLoadToken) {
    return;
  }
  initializeTarot(deck);

  if (currentReading.length > 0) {
    currentReading = localizeReading(currentReading, language);
    setupSpreadGrid(currentSpreadType);
    renderReading(currentReading);
    loadingAnimation.classList.add("hidden");
    newReadingBtn.classList.remove("hidden");
    return;
  }

  loadingAnimation.classList.add("hidden");
}

// Helper function to create card element
function createCardElement(card, position) {
  const cardDiv = document.createElement("div");
  const isReversed = card.name.includes("Reversed");
  const detailsHtml = card["details-html"];
  const cardVisual = card.image
    ? `<img src="./decks/images/${card.image}" alt="${card.name}" class="mx-auto mb-4 h-56 w-auto rounded-md shadow-lg transition-transform duration-500 ${
        isReversed ? "rotate-180" : ""
      }">`
    : `<div class="text-4xl mb-4">${card.symbol}</div>`;
  const detailsButton = detailsHtml
    ? `<button class="show-details-btn mt-4 w-full rounded-lg bg-purple-600 px-4 py-2 text-sm font-semibold text-white transition-colors hover:bg-purple-700" type="button" data-card-name="${card.name}" data-details-html="${detailsHtml}">Show Details</button>`
    : "";

  cardDiv.className =
    "bg-gray-800 p-6 rounded-lg transform transition-all duration-500 hover:scale-105 fade-in";
  cardDiv.innerHTML = `
                <h3 class="text-lg font-semibold text-purple-400 mb-2">${position}</h3>
                <div class="card-content bg-gray-700 p-4 rounded-lg">
                    ${cardVisual}
                    <h4 class="text-xl mb-2">${card.name}</h4>
                    <p class="text-gray-400 mb-2">${card.description}</p>
                    <p class="text-purple-300 italic">${
                      card.meanings.length > 1
                        ? card.meanings.join(", ")
                        : card.meanings[0]
                    }</p>
                    ${detailsButton}
                </div>
            `;
  return cardDiv;
}

function openDetailsModal(cardName, detailsHtml) {
  detailsModalTitle.textContent = `${cardName} Details`;
  detailsModalFrame.src = `./decks/ko/details-html/${encodeURIComponent(detailsHtml)}`;
  detailsModal.classList.remove("hidden");
}

function closeDetailsModal() {
  detailsModal.classList.add("hidden");
  detailsModalFrame.removeAttribute("src");
}

function localizeReading(reading, language) {
  const cardLookup = cardLookupByLanguage.get(language);

  return reading.map(({ position, card }) => ({
    position,
    card: cardLookup?.get(card.name) || card
  }));
}

function setupSpreadGrid(spreadType) {
  if (spreadType === "single") {
    spreadContainer.className = "grid gap-6";
  } else if (spreadType === "Three-Card Spread") {
    spreadContainer.className = "grid grid-cols-1 md:grid-cols-3 gap-6";
  } else if (spreadType === "celtic-cross") {
    spreadContainer.className =
      "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6";
  }
}

function renderReading(reading) {
  spreadContainer.innerHTML = "";
  reading.forEach(({ position, card }) => {
    spreadContainer.appendChild(createCardElement(card, position));
  });
  readingResults.classList.remove("hidden");
}

// Function to perform reading
async function performReading(spreadType) {
  const token = viewToken;
  currentSpreadType = spreadType;
  currentReading = [];

  // Show loading animation
  loadingAnimation.classList.remove("hidden");
  readingResults.classList.add("hidden");

  // Clear previous reading
  spreadContainer.innerHTML = "";

  // Simulate loading time
  await new Promise((resolve) => setTimeout(resolve, 1500));
  if (token !== viewToken) {
    return;
  }

  // Get reading
  const reading = tarot.doReading(spreadType);
  currentReading = reading;

  // Setup grid based on spread type
  setupSpreadGrid(spreadType);

  // Hide loading and show results
  loadingAnimation.classList.add("hidden");
  readingResults.classList.remove("hidden");

  // Reveal cards one by one
  for (let i = 0; i < reading.length; i++) {
    await new Promise((resolve) => setTimeout(resolve, 500));
    if (token !== viewToken) {
      return;
    }
    const cardElement = createCardElement(
      currentReading[i].card,
      currentReading[i].position
    );
    spreadContainer.appendChild(cardElement);
  }

  setTimeout(() => {
    if (token !== viewToken) {
      return;
    }
    newReadingBtn.classList.remove("hidden");
  }, 500); // Delay of 500 milliseconds (smooth things out)
}

// Event Listeners

spreadButtons.forEach((button, index) => {
  button.addEventListener("click", () => {
    const token = viewToken;
    spreadSelection.classList.add("fade-out");
    spreadSelection.classList.remove("fade-in");
    setTimeout(() => {
      if (token !== viewToken) {
        return;
      }
      spreadSelection.classList.add("hidden", "fade-in");
      spreadSelection.classList.remove("fade-out");
      //newReadingBtn.classList.remove('hidden');

      const spreadTypes = tarot.listSpreads();
      performReading(spreadTypes[index]);
    }, 500); // Delay of 500 milliseconds (smooth things out)
  });
});

newReadingBtn.addEventListener("click", () => {
  currentReading = [];
  currentSpreadType = null;
  readingResults.classList.add("hidden");
  newReadingBtn.classList.add("hidden");
  spreadSelection.classList.remove("hidden");
});

languageButtons.forEach((button) => {
  button.addEventListener("click", () => {
    setLanguage(button.dataset.language).catch((error) => {
      console.error("Failed to switch language:", error);
    });
  });
});

spreadContainer.addEventListener("click", (event) => {
  const button = event.target.closest(".show-details-btn");
  if (!button) {
    return;
  }

  openDetailsModal(button.dataset.cardName, button.dataset.detailsHtml);
});

detailsModalClose.addEventListener("click", closeDetailsModal);

detailsModal.addEventListener("click", (event) => {
  if (event.target === detailsModal) {
    closeDetailsModal();
  }
});

  
(async () => {
  try {
    updateLanguageButtons();
    await setLanguage(currentLanguage);

    // Handle page loader fade-out
    const loader = document.getElementById("pageLoader");
    loader.classList.add("opacity-0", "transition-opacity", "duration-700");

    // Wait for the transition to finish before hiding the loader
    setTimeout(() => {
      loader.style.display = "none";
    }, 700);
    
  } catch (error) {
    console.error("❌ Failed to fetch deck:", error);
  }
})();
</script>
